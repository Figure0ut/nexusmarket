spring.application.name=nexusmarket

# Disable Open Session In View (OSIV) — follows Hexagonal Architecture best practices
# by preventing lazy-loading during view rendering
spring.jpa.open-in-view=false

# SQL Relational Persistence (H2 in-memory for transactional entities)
spring.datasource.url=jdbc:h2:mem:nexusmarket;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initial Administrator (bootstrap account, see InitialAdministratorConfig)
nexusmarket.initial-admin.identifier=ADM-001
nexusmarket.initial-admin.identity-document=CC-1000000001
nexusmarket.initial-admin.full-name=NexusMarket Administrator
nexusmarket.initial-admin.email=admin@nexusmarket.com
